<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Order Form</title>
    <!-- Import Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-green: #27ae60;
            --accent-yellow: #f1c40f;
            --soft-bg: #fdfdfd;
            --text-main: #1a1a1a;
            --text-muted: #7f8c8d;
            --border-color: #f1f1f1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--soft-bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #eeeeee;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.25s ease;
            background: #fcfcfc;
            box-sizing: border-box;
            color: var(--text-main);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.08);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--text-main); /* Hitam agar lebih kontras & clean */
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-green);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.2);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        ::placeholder {
            color: #bdc3c7;
        }

        /* Border accent di paling atas */
        .top-line {
            height: 4px;
            width: 60px;
            background: var(--accent-yellow);
            margin: 0 auto 20px auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="top-line"></div>
    <h2>Order Form</h2>
    <p class="subtitle">Isi data pesanan dengan lengkap</p>
    
    <form id="orderForm">
        <div class="form-group">
            <label>Admin Tujuan</label>
            <select id="admin_tujuan">
                <option value="admin1">Rendi</option>
                <option value="admin2">Muaz</option>
            </select>
        </div>

        <div class="form-group">
            <label>Penerima</label>
            <input type="text" id="penerima" placeholder="Nama lengkap" required>
        </div>

        <div class="form-group">
            <label>Pengirim</label>
            <input type="text" id="pengirim" placeholder="Nama pengirim" required>
        </div>

        <div class="form-group">
            <label>Nomor HP</label>
            <input type="tel" id="hp" placeholder="08..." required>
        </div>

        <div class="form-group">
            <label>Alamat</label>
            <textarea id="alamat" rows="2" placeholder="Alamat lengkap tujuan..." required></textarea>
        </div>

        <div class="form-group">
            <label>Pesanan</label>
            <textarea id="pesanan" rows="3" placeholder="Detail barang..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnText">Kirim Pesanan</button>
    </form>
</div>

<script>
    // Script tetap sama dengan sebelumnya
    const token = "8703060544:AAHwZ_Kon_9dflixAnIDA_Wlr9ittFh3KV0"; 
    const adminID1 = "5132185030"; 
    const adminID2 = "7447271812"; 

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('btnText');
        const originalText = btn.innerText;
        btn.innerText = "Mengirim...";
        btn.disabled = true;

        const data = {
            tujuan: document.getElementById('admin_tujuan').value,
            penerima: document.getElementById('penerima').value,
            pengirim: document.getElementById('pengirim').value,
            hp: document.getElementById('hp').value,
            alamat: document.getElementById('alamat').value,
            pesanan: document.getElementById('pesanan').value
        };

        const targetID = (data.tujuan === "admin1") ? adminID1 : adminID2;

        const pesan = `📦 *PESANAN BARU*\n\n` +
                      `👤 Penerima: *${data.penerima}*\n\n` +
                      `📤 Pengirim: ${data.pengirim}\n\n` +
                      `📞 No HP: ${data.hp}\n` +
                      `📍 Alamat: ${data.alamat}\n\n` +
                      `🛒 *Pesanan:*\n*${data.pesanan}*`;

        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: targetID,
                text: pesan,
                parse_mode: 'Markdown'
            })
        })
        .then(res => {
            if (res.ok) {
                alert("Sukses! Pesanan telah diteruskan.");
                document.getElementById('orderForm').reset();
            } else {
                alert("Gagal mengirim pesan.");
            }
        })
        .catch(() => alert("Koneksi bermasalah."))
        .finally(() => {
            btn.innerText = originalText;
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
