<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Order Form</title>
    <style>
        :root {
            --primary-green: #2ecc71;
            --primary-yellow: #f1c40f;
            --dark-green: #27ae60;
            --bg-gradient: linear-gradient(135deg, #2ecc71 0%, #f1c40f 100%);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            border-bottom: 5px solid var(--primary-yellow);
        }

        .form-card h2 {
            text-align: center;
            color: var(--dark-green);
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #444;
            font-weight: 700;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-green);
            background-color: #fff;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--dark-green);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-submit:hover {
            background: var(--primary-yellow);
            color: #333;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .form-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Order Form</h2>
    <form action="send.php" method="POST">
        
        <div class="form-group">
            <label>Tujuan Admin</label>
            <select name="admin_tujuan">
                <option value="admin1">Admin Utama (Hijau)</option>
                <option value="admin2">Admin Cadangan (Kuning)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nama Penerima</label>
            <input type="text" name="penerima" placeholder="Nama lengkap penerima" required>
        </div>

        <div class="form-group">
            <label>Nama Pengirim</label>
            <input type="text" name="pengirim" placeholder="Nama lengkap pengirim" required>
        </div>

        <div class="form-group">
            <label>Nomor HP</label>
            <input type="tel" name="hp" placeholder="08xxxxxxxxxx" required>
        </div>

        <div class="form-group">
            <label>Alamat Pengiriman</label>
            <textarea name="alamat" rows="2" placeholder="Tulis alamat lengkap..." required></textarea>
        </div>

        <div class="form-group">
            <label>Detail Pesanan</label>
            <textarea name="pesanan" rows="3" placeholder="Apa yang ingin dibeli?" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim ke Telegram</button>
    </form>
</div>

</body>
</html>
